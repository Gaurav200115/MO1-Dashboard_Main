# Build check on every PR into main; build + deploy to the Hostinger VPS on
# every push to main, or by hand from the Actions tab ("Run workflow").
#
# The deploy itself is ~/deploy.sh on the VPS. The SSH key in VPS_SSH_KEY is
# pinned to that script in the VPS's authorized_keys, so it can trigger a
# deploy and nothing else.

name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    # Pinned rather than ubuntu-latest, which GitHub is moving to Ubuntu 26.04
    # (Oct-Nov 2026). Move both jobs to ubuntu-26.04 deliberately when ready.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      # v7 of both actions runs on Node 24; v4 ran on Node 20, which GitHub
      # removed from the runners in September 2026.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run ~/deploy.sh on the VPS
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
